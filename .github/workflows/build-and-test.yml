name: Backend application build and test
on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: rathinamaanikam/bms:gta

jobs:
  build-and-test-job:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout pannu
        uses: actions/checkout@v4 # Changed v7 to v4
      - name: install java 21
        uses: actions/setup-java@v4 # Changed v5 to v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: mvn build
        run: mvn clean install -DskipTests=true
      - name: mvn testing
        run: mvn test
      - name: docker image build
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }} .
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: docker image push
        run: docker push ${{ env.DOCKER_IMAGE_NAME }}

  deploy-panna-porom-guys:
    env:
      DOCKER_CONTAINER_NAME: simplybyte-backend
    needs: build-and-test-job
    runs-on: ubuntu-latest
    steps:
      - name: server ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.HOST_IP }}
          username: ec2-user
          key: ${{ secrets.AWS_EC2_KE }}
          port: 22
          script: |
            # Pull new image
            docker pull ${{ env.DOCKER_IMAGE_NAME }}
            
            # Stop and remove existing container if it's already running to prevent name clash errors
            docker rm -f ${{ env.DOCKER_CONTAINER_NAME }} || true
            
            # Run the new container
            docker run -d -p 80:8090 --name ${{ env.DOCKER_CONTAINER_NAME }} ${{ env.DOCKER_IMAGE_NAME }}
